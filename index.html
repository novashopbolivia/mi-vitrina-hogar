<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaShop Bolivia | Tienda Online</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --whatsapp: #25D366;
            --whatsapp-dark: #128C7E;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --price: #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; }

        /* HEADER */
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .logo p { font-size: 0.8rem; color: #94a3b8; }
        
        /* BOTON DEL CARRITO EN HEADER */
        .cart-btn-header {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: 0.2s;
            position: relative;
        }
        .cart-btn-header:hover { background: #1d4ed8; transform: scale(1.03); }
        .cart-badge {
            background: #ef4444;
            color: white;
            border-radius: 50%;
            font-size: 0.75rem;
            padding: 2px 7px;
            font-weight: bold;
        }

        /* BANNER */
        .hero {
            background: #e2e8f0;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .hero h2 { font-size: 1.6rem; color: var(--primary); margin-bottom: 6px; }
        .hero p { color: var(--text-muted); font-size: 0.95rem; }

        /* CONTENEDOR PRINCIPAL */
        .main-layout {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 30px;
        }

        /* SIDEBAR DE FILTROS */
        .sidebar {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            height: fit-content;
            position: sticky;
            top: 100px;
        }
        .sidebar h3 { font-size: 1.1rem; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        
        .search-box {
            margin-bottom: 20px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 35px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .search-box input:focus { border-color: var(--accent); }
        .search-box i { position: absolute; left: 12px; top: 12px; color: var(--text-muted); }

        .category-list { list-style: none; }
        .category-item { margin-bottom: 8px; }
        .cat-btn {
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .cat-btn:hover, .cat-btn.active {
            background: #eff6ff;
            color: var(--accent);
            font-weight: 600;
        }

        /* SUBCATEGORÍAS */
        .subcat-list {
            list-style: none;
            margin-left: 15px;
            padding-left: 10px;
            border-left: 2px solid var(--border);
            margin-top: 4px;
            display: none;
        }
        .subcat-list.open { display: block; }
        .subcat-btn {
            width: 100%;
            text-align: left;
            padding: 5px 8px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        .subcat-btn:hover, .subcat-btn.active {
            color: var(--accent);
            font-weight: 600;
            background: #f1f5f9;
        }

        /* GRID DE PRODUCTOS */
        .products-section { display: flex; flex-direction: column; gap: 20px; }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        /* TARJETA DE PRODUCTO */
        .tarjeta {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .tarjeta:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
        }
        .img-container {
            width: 100%;
            height: 200px;
            position: relative;
            background-color: #f1f5f9;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge-cat {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }
        .info-card {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .info-card h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .subcat-tag {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .precio-box {
            margin-top: auto;
            margin-bottom: 15px;
        }
        .precio {
            font-size: 1.35rem;
            color: var(--price);
            font-weight: 700;
        }

        /* BOTONES DE ACCIÓN */
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-cart {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn-cart:hover { background: var(--accent-hover); }
        .btn-wa-direct {
            background: #f0fdf4;
            color: var(--whatsapp-dark);
            border: 1px solid #bbf7d0;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.82rem;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-wa-direct:hover { background: #dcfce7; }

        /* MODAL / DRAWER DEL CARRITO */
        .cart-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
        }
        .cart-overlay.open { opacity: 1; pointer-events: all; }
        
        .cart-drawer {
            position: fixed;
            top: 0; right: -420px;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: white;
            z-index: 1000;
            box-shadow: -5px 0 25px rgba(0,0,0,0.15);
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .cart-drawer.open { right: 0; }

        .cart-header {
            padding: 20px;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-header h3 { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        .btn-close-cart { background: transparent; border: none; color: white; font-size: 1.3rem; cursor: pointer; }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .cart-item {
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }
        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            background: #f1f5f9;
        }
        .cart-item-info { flex-grow: 1; }
        .cart-item-info h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
        .cart-item-price { color: var(--price); font-weight: 700; font-size: 0.95rem; }
        
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }
        .qty-btn {
            background: #f1f5f9;
            border: 1px solid var(--border);
            width: 26px; height: 26px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-remove-item {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 5px;
        }

        .cart-footer {
            padding: 20px;
            background: #f8fafc;
            border-top: 1px solid var(--border);
        }
        .cart-total-box {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .cart-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .cart-form input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.88rem;
            outline: none;
        }
        .btn-checkout-wa {
            background: var(--whatsapp);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        .btn-checkout-wa:hover { background: var(--whatsapp-dark); }

        /* RESPONSIVE */
        @media (max-width: 868px) {
            .main-layout { grid-template-columns: 1fr; }
            .sidebar { position: static; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo">
                <h1>🏪 NovaShop Bolivia</h1>
                <p>Variedad, calidad y envíos en La Paz</p>
            </div>
            <button class="cart-btn-header" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Carrito</span>
                <span id="cartCount" class="cart-badge">0</span>
            </button>
        </div>
    </header>

    <!-- HERO BANNER -->
    <div class="hero">
        <h2>Catálogo de Productos</h2>
        <p>Selecciona tu categoría, añade tus productos al carrito y haz tu pedido directo por WhatsApp 📲</p>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="main-layout">
        
        <!-- SIDEBAR CON FILTROS -->
        <aside class="sidebar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar producto..." oninput="filtrarProductos()">
            </div>

            <h3><i class="fa-solid fa-layer-group"></i> Categorías</h3>
            <ul class="category-list" id="categoryList">
                <li class="category-item">
                    <button class="cat-btn active" onclick="seleccionarCategoria('todas')">
                        <span>🏷️ Todas las categorías</span>
                    </button>
                </li>
                <!-- Se llenarán dinámicamente -->
            </ul>
        </aside>

        <!-- LISTA DE PRODUCTOS -->
        <main class="products-section">
            <div class="results-header">
                <span id="activeFilterLabel">Mostrando: Todos los productos</span>
                <span id="productCounter">Cargando...</span>
            </div>

            <div id="vitrina" class="grid-productos">
                <p style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Cargando productos de la tienda...
                </p>
            </div>
        </main>

    </div>

    <!-- MODAL / DRAWER DEL CARRITO -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3><i class="fa-solid fa-cart-shopping"></i> Tu Carrito</h3>
            <button class="btn-close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="cart-items" id="cartItemsContainer">
            <!-- Items del carrito -->
        </div>

        <div class="cart-footer">
            <div class="cart-total-box">
                <span>Total:</span>
                <span id="cartTotalText" style="color: var(--price);">0.00 Bs.</span>
            </div>

            <div class="cart-form">
                <input type="text" id="clientName" placeholder="Tu Nombre completo *" required>
                <input type="text" id="clientAddress" placeholder="Dirección de entrega / Ciudad (ej: La Paz, Miraflores) *" required>
            </div>

            <button class="btn-checkout-wa" onclick="finalizarPedidoWhatsApp()">
                <i class="fa-brands fa-whatsapp fa-xl"></i> Confirmar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <script>
        // ================= CONFIGURACIÓN =================
        const BACKEND_URL = 'https://novashop-backend-wbaj.onrender.com/api/productos';
        // 👇 Pon tu número de WhatsApp real con código de país (ej: Bolivia 59170000000)
        const WHATSAPP_PHONE = '59170000000'; 
        // =================================================

        let todosLosProductos = [];
        let categoriaSeleccionada = 'todas';
        let subcategoriaSeleccionada = 'todas';
        let carrito = JSON.parse(localStorage.getItem('novashop_cart')) || [];

        // 1. CARGAR PRODUCTOS DEL BACKEND
        async function cargarProductos() {
            try {
                const res = await fetch(BACKEND_URL);
                if (!res.ok) throw new Error('Error en el servidor');
                todosLosProductos = await res.json();
                
                construirMenuCategorias();
                renderizarProductos(todosLosProductos);
                actualizarUIcarrito();
            } catch (err) {
                console.error(err);
                document.getElementById('vitrina').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 40px;">
                        <i class="fa-solid fa-triangle-exclamation fa-2x"></i>
                        <p style="margin-top: 10px;">Hubo un problema al cargar los productos.</p>
                    </div>`;
            }
        }

        // 2. CONSTRUIR MENÚ DE CATEGORÍAS Y SUBCATEGORÍAS DINÁMICAMENTE
        function construirMenuCategorias() {
            const catMap = {}; // { "Mecanica": ["Llaves", "Auto"], "Hogar": ["Cocina"] }

            todosLosProductos.forEach(p => {
                const cat = p.categoria || 'Varios';
                const subcat = p.subcategoria;

                if (!catMap[cat]) catMap[cat] = new Set();
                if (subcat) catMap[cat].add(subcat);
            });

            const catList = document.getElementById('categoryList');
            catList.innerHTML = `
                <li class="category-item">
                    <button class="cat-btn ${categoriaSeleccionada === 'todas' ? 'active' : ''}" onclick="seleccionarCategoria('todas')">
                        <span>🏷️ Todas las categorías</span>
                    </button>
                </li>
            `;

            for (const [cat, subcats] of Object.entries(catMap)) {
                const tieneSubcats = subcats.size > 0;
                const li = document.createElement('li');
                li.className = 'category-item';

                let subcatHtml = '';
                if (tieneSubcats) {
                    subcatHtml = `<ul class="subcat-list" id="subcats-${cat}">`;
                    subcats.forEach(sub => {
                        subcatHtml += `
                            <li>
                                <button class="subcat-btn" onclick="seleccionarSubcategoria('${cat}', '${sub}')">
                                    • ${sub}
                                </button>
                            </li>`;
                    });
                    subcatHtml += `</ul>`;
                }

                li.innerHTML = `
                    <button class="cat-btn" onclick="seleccionarCategoria('${cat}')">
                        <span>📦 ${cat}</span>
                        ${tieneSubcats ? '<i class="fa-solid fa-chevron-down" style="font-size: 0.75rem;"></i>' : ''}
                    </button>
                    ${subcatHtml}
                `;
                catList.appendChild(li);
            }
        }

        // 3. FILTRADO Y RENDERIZADO
        function seleccionarCategoria(cat) {
            categoriaSeleccionada = cat;
            subcategoriaSeleccionada = 'todas';

            // Resaltar botón activo
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.subcat-btn').forEach(btn => btn.classList.remove('active'));

            // Toggle subcategorías
            document.querySelectorAll('.subcat-list').forEach(el => el.classList.remove('open'));
            const subList = document.getElementById(`subcats-${cat}`);
            if (subList) subList.classList.add('open');

            filtrarProductos();
        }

        function seleccionarSubcategoria(cat, sub) {
            categoriaSeleccionada = cat;
            subcategoriaSeleccionada = sub;

            document.querySelectorAll('.subcat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim().includes(sub));
            });

            filtrarProductos();
        }

        function filtrarProductos() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtrados = todosLosProductos.filter(p => {
                const matchCat = (categoriaSeleccionada === 'todas') || (p.categoria === categoriaSeleccionada);
                const matchSub = (subcategoriaSeleccionada === 'todas') || (p.subcategoria === subcategoriaSeleccionada);
                const matchSearch = p.nombre.toLowerCase().includes(query) || (p.categoria && p.categoria.toLowerCase().includes(query));
                return matchCat && matchSub && matchSearch;
            });

            // Actualizar etiqueta del filtro activo
            let label = 'Todos los productos';
            if (categoriaSeleccionada !== 'todas') label = categoriaSeleccionada;
            if (subcategoriaSeleccionada !== 'todas') label += ` ➔ ${subcategoriaSeleccionada}`;
            document.getElementById('activeFilterLabel').textContent = `Mostrando: ${label}`;

            renderizarProductos(filtrados);
        }

        function renderizarProductos(productos) {
            const vitrina = document.getElementById('vitrina');
            document.getElementById('productCounter').textContent = `${productos.length} productos`;

            if (productos.length === 0) {
                vitrina.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
                        <i class="fa-regular fa-folder-open fa-2x"></i>
                        <p style="margin-top: 10px;">No se encontraron productos en esta categoría.</p>
                    </div>`;
                return;
            }

            vitrina.innerHTML = productos.map(prod => {
                const fotoUrl = prod.imagen_url || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?w=500';
                const msgDirect = `Hola! Me interesa comprar directamente el producto: ${prod.nombre} (Precio: ${prod.precio} Bs.)`;
                const directWaLink = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msgDirect)}`;

                return `
                    <div class="tarjeta">
                        <div class="img-container">
                            <img src="${fotoUrl}" alt="${prod.nombre}" loading="lazy">
                            <span class="badge-cat">${prod.categoria || 'Tienda'}</span>
                        </div>
                        <div class="info-card">
                            <h3>${prod.nombre}</h3>
                            <p class="subcat-tag">${prod.subcategoria ? '📂 ' + prod.subcategoria : ''}</p>
                            
                            <div class="precio-box">
                                <span class="precio">${prod.precio} Bs.</span>
                            </div>

                            <div class="card-actions">
                                <button class="btn-cart" onclick="agregarAlCarrito(${prod.id})">
                                    <i class="fa-solid fa-cart-plus"></i> Agregar al carrito
                                </button>
                                <a href="${directWaLink}" target="_blank" class="btn-wa-direct">
                                    <i class="fa-brands fa-whatsapp"></i> Pedir 1 unidad directo
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 4. LÓGICA DEL CARRITO DE COMPRAS
        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
            document.getElementById('cartOverlay').classList.toggle('open');
        }

        function agregarAlCarrito(id) {
            const prod = todosLosProductos.find(p => p.id === id);
            if (!prod) return;

            const itemEnCarrito = carrito.find(i => i.id === id);
            if (itemEnCarrito) {
                itemEnCarrito.cantidad += 1;
            } else {
                carrito.push({
                    id: prod.id,
                    nombre: prod.nombre,
                    precio: parseFloat(prod.precio),
                    imagen_url: prod.imagen_url,
                    cantidad: 1
                });
            }

            guardarCarrito();
            actualizarUIcarrito();
            
            // Abrir automáticamente el carrito para feedback visual
            document.getElementById('cartDrawer').classList.add('open');
            document.getElementById('cartOverlay').classList.add('open');
        }

        function cambiarCantidad(id, delta) {
            const item = carrito.find(i => i.id === id);
            if (!item) return;

            item.cantidad += delta;
            if (item.cantidad <= 0) {
                carrito = carrito.filter(i => i.id !== id);
            }

            guardarCarrito();
            actualizarUIcarrito();
        }

        function eliminarDelCarrito(id) {
            carrito = carrito.filter(i => i.id !== id);
            guardarCarrito();
            actualizarUIcarrito();
        }

        function guardarCarrito() {
            localStorage.setItem('novashop_cart', JSON.stringify(carrito));
        }

        function actualizarUIcarrito() {
            const totalItems = carrito.reduce((acc, i) => acc + i.cantidad, 0);
            document.getElementById('cartCount').textContent = totalItems;

            const container = document.getElementById('cartItemsContainer');
            if (carrito.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                        <i class="fa-solid fa-cart-shopping fa-3x" style="opacity: 0.3;"></i>
                        <p style="margin-top: 15px;">Tu carrito está vacío</p>
                    </div>`;
                document.getElementById('cartTotalText').textContent = '0.00 Bs.';
                return;
            }

            let total = 0;
            container.innerHTML = carrito.map(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                const foto = item.imagen_url || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?w=500';

                return `
                    <div class="cart-item">
                        <img src="${foto}" alt="${item.nombre}">
                        <div class="cart-item-info">
                            <h4>${item.nombre}</h4>
                            <div class="cart-item-price">${item.precio} Bs.</div>
                            <div class="cart-item-qty">
                                <button class="qty-btn" onclick="cambiarCantidad(${item.id}, -1)">-</button>
                                <span>${item.cantidad}</span>
                                <button class="qty-btn" onclick="cambiarCantidad(${item.id}, 1)">+</button>
                            </div>
                        </div>
                        <button class="btn-remove-item" onclick="eliminarDelCarrito(${item.id})">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('cartTotalText').textContent = `${total.toFixed(2)} Bs.`;
        }

        // 5. FINALIZAR PEDIDO VÍA WHATSAPP
        function finalizarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert('Tu carrito está vacío. Agrega productos antes de confirmar.');
                return;
            }

            const nombre = document.getElementById('clientName').value.trim();
            const direccion = document.getElementById('clientAddress').value.trim();

            if (!nombre || !direccion) {
                alert('Por favor completa tu Nombre y Dirección de entrega.');
                return;
            }

            let total = 0;
            let listaTexto = '';

            carrito.forEach((item, index) => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                listaTexto += `${index + 1}. *${item.nombre}*\n   ▫️ Cant: ${item.cantidad} x ${item.precio} Bs. = *${subtotal} Bs.*\n`;
            });

            const mensaje = 
`👋 ¡Hola NovaShop Bolivia! Quiero realizar el siguiente pedido:

📋 *DETALLE DE LA COMPRA:*
${listaTexto}
💰 *TOTAL A PAGAR:* *${total.toFixed(2)} Bs.*

👤 *DATOS DEL CLIENTE:*
▪️ *Nombre:* ${nombre}
▪️ *Dirección / Ciudad:* ${direccion}

¿Tienen disponibilidad para coordinar la entrega? Muchas gracias.`;

            const urlWa = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWa, '_blank');
        }

        // Iniciar
        cargarProductos();
    </script>
</body>
</html>
