<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda de Hogar</title>
    <style>
        /* Estilos rápidos para que se vea hermoso y ordenado */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f9f9f9; color: #333; }
        header { text-align: center; background-color: #2c3e50; color: white; padding: 20px; }
        .contenedor { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .tarjeta { background: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tarjeta img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; background-color: #eaeaea; }
        .precio { font-size: 1.4rem; color: #27ae60; font-weight: bold; margin: 15px 0; }
        .btn-whatsapp { display: block; background-color: #25D366; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🏪 Mi Tienda del Hogar</h1>
        <p>¡Productos de calidad directos a tu hogar en La Paz! Envíos rápidos.</p>
    </header>

    <div class="contenedor">
        <div id="vitrina" class="grid-productos">
            <p>Cargando tus hermosos productos...</p>
        </div>
    </div>

    <script>
        async function cargarProductos() {
            try {
                // 👇 AQUÍ ESTÁ LA URL COMPLETA DE TU SERVIDOR EN RENDER
                const respuesta = await fetch('https://novashop-backend-wbsj.onrender.com/api/productos');
                const productos = await respuesta.json();
                
                const vitrina = document.getElementById('vitrina');
                vitrina.innerHTML = ''; // Limpiamos el texto de "Cargando..."

                // Recorremos cada producto que trajimos de Supabase
                productos.forEach(prod => {
                    const mensajeWa = `Hola! Me interesa comprar el producto: ${prod.nombre}`;
                    // Pon tu número con código de país (ejemplo: 59170000000 para Bolivia)
                    const linkWhatsapp = `https://wa.me/591XXXXXXXX?text=${encodeURIComponent(mensajeWa)}`;

                    const fotoUrl = prod.imagen_url || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?w=500';

                    vitrina.innerHTML += `
                        <div class="tarjeta">
                            <img src="${fotoUrl}" alt="${prod.nombre}">
                            <h3>${prod.nombre}</h3>
                            <p>Categoría: <strong>${prod.categoria}</strong></p>
                            <p class="precio">${prod.precio} Bs.</p>
                            <a href="${linkWhatsapp}" target="_blank" class="btn-whatsapp">🛒 Pedir por WhatsApp</a>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar la vitrina:", error);
                document.getElementById('vitrina').innerHTML = '<p>Hubo un problema al cargar los productos.</p>';
            }
        }

        // Ejecutamos la función apenas se abre la página
        cargarProductos();
    </script>
</body>
</html>
